name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-po-idempotency:
    name: Verify PO idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dataplus_po_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dataplus_po_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run concurrent PO creation test
        env:
          DATAPLUS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dataplus_po_test
        run: node scripts/test-purchase-order-idempotency-postgres.cjs

  deploy:
    name: Deploy to DigitalOcean Droplet
    needs: verify-po-idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Pull and rebuild production
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$SENTRY_AUTH_TOKEN"
          # Pass the token through encrypted stdin, never in SSH command arguments.
          printf '%s\n' "$SENTRY_AUTH_TOKEN" "$DEPLOY_REVISION" | ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -euo pipefail
             IFS= read -r SENTRY_AUTH_TOKEN
             IFS= read -r DEPLOY_REVISION
             test -n "$SENTRY_AUTH_TOKEN"
             [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]]
             export SENTRY_AUTH_TOKEN
             cd /root/dataplus
             git fetch origin "$DEPLOY_REVISION"
             git show "$DEPLOY_REVISION:scripts/deploy-production.sh" > /tmp/dataplus-deploy-production.sh
             export DATAPLUS_DEPLOY_REVISION="$DEPLOY_REVISION"
             export SENTRY_PROJECT=dataplus
             export SENTRY_RELEASE="$DEPLOY_REVISION"
             export COMPOSE_FILE=docker-compose.yml:docker-compose.sentry.yml
             bash /tmp/dataplus-deploy-production.sh'
