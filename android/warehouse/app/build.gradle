plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dataplus.warehouse'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dataplus.warehouse'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '2.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
