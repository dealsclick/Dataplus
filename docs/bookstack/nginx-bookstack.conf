# Include this inside the TLS server block for dataplusapp.duckdns.org.
# BookStack is configured for the /wiki subdirectory, so the proxy strips the
# public prefix while preserving the original scheme and host headers.
location = /wiki {
    return 301 /wiki/;
}

location /wiki/ {
    proxy_pass http://127.0.0.1:6875/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
